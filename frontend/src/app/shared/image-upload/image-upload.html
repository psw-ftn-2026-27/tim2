<section class="stack">
  <div class="actions">
    <label class="button">
      Izaberi sliku
      <input
        class="file-input"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="choose($event)"
      />
    </label>
    <button
      class="button button--primary"
      type="button"
      [disabled]="file() === null || pending()"
      (click)="submit()"
    >
      Otpremi
    </button>
  </div>

  @if (problem()) {
    <p class="error">{{ problem() }}</p>
  } @else if (previewUrl()) {
    <div class="stack">
      <p class="meta">Izabrana slika: {{ file()?.name }}</p>
      <img class="image" alt="Pregled izabrane slike" [src]="previewUrl()" (load)="revokePreview()" (error)="revokePreview()" />
    </div>
  }

  @if (pending()) {
    <p class="meta">Otpremanje u toku...</p>
  }

  @if (uploadedUrl()) {
    <div class="stack">
      <p class="meta">Otpremljena slika: {{ uploadedUrl() }}</p>
      <img class="image" alt="Otpremljena slika" [src]="uploadedUrl()" />
    </div>
  }
</section>

@if (error()) {
  <p class="error">{{ error() }}</p>
}
