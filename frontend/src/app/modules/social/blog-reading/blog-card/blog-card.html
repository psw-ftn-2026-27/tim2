<article class="card stack">
  <h3>{{ blog().title }}</h3>

  <app-blog-description [description]="blog().description" [plain]="true" />

  <p class="meta">Status: {{ blog().status }}</p>

  <p class="meta">Comments: {{ blog().comments.length }}</p>

  <a [routerLink]="['/social', blog().id]">Read more</a>
</article>
