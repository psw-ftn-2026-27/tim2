<header>
  <nav class="container">
    <a routerLink="/">Home</a>
    <a routerLink="/exploration">Exploration</a>
    <a routerLink="/games">Games</a>
    <a routerLink="/social">Social</a>
    <a routerLink="/payment">Payment</a>

    <span class="nav-user">
      @if (auth.user(); as user) {
        <span>{{ user.email }}</span>
        <button class="button" type="button" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login">Login</a>
        <a routerLink="/register">Register</a>
      }
    </span>
  </nav>
</header>

<main class="container stack">
  <router-outlet />
</main>

@if (auth.user()) {
  <footer>
    <button class="link-button" type="button" (click)="openSettings()">Cookie settings</button>
  </footer>
}

@if (showBanner()) {
  <app-consent-banner
    [consent]="analytics.consent()"
    (accept)="accept()"
    (decline)="decline()"
  />
}
